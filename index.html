<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="user-info">
                <div class="avatar-ring"><img id="u-photo" src=""></div>
                <div class="text">
                    <span class="small">Ciao,</span>
                    <span id="u-name" class="bold">Giacomo</span>
                </div>
            </div>
            <div class="wallet-pill" onclick="tab('saldo')">
                <span>💳</span> <span id="u-balance">€44.00</span>
            </div>
        </header>

        <main id="content">
            <section id="page-menu" class="page active">
                <div class="hero">
                    <h1 class="gold-glow">RAINBOW SERVICE</h1>
                </div>
                
                <div id="cat-nav" class="categories-scroll"></div>

                <div id="shop-container"></div>
            </section>

            <section id="page-info" class="page">...</section>
            <section id="page-gruppo" class="page">...</section>
            <section id="page-saldo" class="page">...</section>
            <section id="page-contatti" class="page">...</section>
        </main>

        <nav class="navbar">
            <div class="nav-item active" id="nav-menu" onclick="tab('menu')"><span>≡</span><p>MENU</p></div>
            <div class="nav-item" id="nav-info" onclick="tab('info')"><span>ⓘ</span><p>INFO</p></div>
            <div class="nav-item" id="nav-gruppo" onclick="tab('gruppo')"><span>👥</span><p>GRUPPO</p></div>
            <div class="nav-item" id="nav-saldo" onclick="tab('saldo')"><span>💳</span><p>SALDO</p></div>
            <div class="nav-item" id="nav-contatti" onclick="tab('contatti')"><span>✉️</span><p>CONTATTI</p></div>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
