<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="user-info">
                <div class="avatar"><img id="u-photo" src="https://via.placeholder.com/100"></div>
                <div class="text">
                    <span class="small">Ciao,</span>
                    <span id="u-name" class="bold">Caricamento...</span>
                </div>
            </div>
            <div class="wallet" onclick="tab('saldo')">
                €<span id="u-balance">0.00</span>
            </div>
        </header>

        <main id="content">
            <section id="page-menu" class="page active">
                <div class="banner"><img src="https://via.placeholder.com/600x250/111/D4AF37?text=RAINBOW+SERVICE"></div>
                <h2 class="title">INFO SERVIZIO</h2>
                <div class="grid">
                    <div class="card">🛡️ SICUREZZA</div>
                    <div class="card">⚡ RAPIDITÀ</div>
                    <div class="card gold">💬 VANTAGGI</div>
                </div>
                <button class="btn-main">COMMUNITY</button>
            </section>

            <section id="page-saldo" class="page">
                <h2 class="title">IL TUO SALDO</h2>
                <div class="wallet-box">
                    <div class="amount">€<span id="u-balance-big">0.00</span></div>
                    <button class="btn-main" onclick="alert('Contatta l\'admin')">RICARICA ORA</button>
                </div>
            </section>

            <section id="page-info" class="page">
                <h2 class="title">SUPPORTO</h2>
                <div class="card">✉️ Contatta l'Admin per assistenza</div>
            </section>
        </main>

        <nav class="navbar">
            <div class="nav-item active" id="btn-menu" onclick="tab('menu')">
                <span class="icon">≡</span><p>MENU</p>
            </div>
            <div class="nav-item" id="btn-info" onclick="tab('info')">
                <span class="icon">ⓘ</span><p>INFO</p>
            </div>
            <div class="nav-item" id="btn-saldo" onclick="tab('saldo')">
                <span class="icon">💳</span><p>SALDO</p>
            </div>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
