<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="user-info">
                <div class="avatar-ring"><img id="u-photo" src=""></div>
                <div class="text">
                    <span class="small">Ciao,</span>
                    <span id="u-name" class="bold">Giacomo</span>
                </div>
            </div>
            <div class="wallet-pill" onclick="tab('saldo')">
                <span id="u-balance-head">€44.00</span>
            </div>
        </header>

        <main id="content">
            <section id="page-menu" class="page active">
                <div id="cat-nav" class="categories-scroll"></div>
                <div id="shop-container"></div>
            </section>

            <section id="page-saldo" class="page">
                <h1 class="page-title-saldo">IL TUO PORTAFOGLIO</h1>
                <div class="card-wallet-border">
                    <p class="label-saldo">SALDO DISPONIBILE</p>
                    <h2 class="main-balance">€44.00</h2>
                    <p class="desc-saldo">Utilizza il credito per acquistare i tuoi abbonamenti preferiti in un click.</p>
                    
                    <button class="action-btn" onclick="aggiungiFondi()">AGGIUNGI FONDI</button>
                    <button class="action-btn" onclick="mostraCronologia()">CRONOLOGIA ACQUISTI</button>
                </div>
            </section>

            <div id="modal-cronologia" class="modal">
                <div class="modal-content">
                    <h3>Cronologia Acquisti</h3>
                    <div id="lista-acquisti">
                        <p style="font-size:12px; color:#888;">Nessun acquisto recente.</p>
                    </div>
                    <button class="gold-btn-small" onclick="chiudiCronologia()">CHIUDI</button>
                </div>
            </div>
        </main>

        <nav class="navbar">
            <div class="nav-item active" id="nav-menu" onclick="tab('menu')"><span class="icon">≡</span><p>MENU</p></div>
            <div class="nav-item" id="nav-info" onclick="tab('info')"><span class="icon">ⓘ</span><p>INFO</p></div>
            <div class="nav-item" id="nav-gruppo" onclick="tab('gruppo')"><span class="icon">👥</span><p>GRUPPO</p></div>
            <div class="nav-item" id="nav-saldo" onclick="tab('saldo')"><span class="icon">💳</span><p>SALDO</p></div>
            <div class="nav-item" id="nav-contatti" onclick="tab('contatti')"><span class="icon">✉️</span><p>CONTATTI</p></div>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
